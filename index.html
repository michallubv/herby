<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miasta i herby</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            margin: 30px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 650px;
            max-width: 100%;
        }

        td {
            border: 1px solid #555;
            padding: 12px;
        }

        td:first-child {
            width: 210px;
            font-weight: bold;
        }

        td:last-child {
            text-align: center;
        }

        img {
            display: block;
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>Miasta i herby</h1>

    <table>
        <tbody>
            <tr>
                <td>Kraków</td>
                <td><img src="POL_Kraków_COA.svg.webp" alt="Herb Krakowa"></td>
            </tr>
            <tr>
                <td>Siemianowice Śląskie</td>
                <td><img src="images.png" alt="Herb Siemianowic Śląskich"></td>
            </tr>
            <tr>
                <td>Piekary Śląskie</td>
                <td><img src="imagesp.png" alt="Herb Piekar Śląskich"></td>
            </tr>
            <tr>
                <td>Katowice</td>
                <td><img src="Katowice_Herb.svg.webp" alt="Herb Katowic"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
